 if(sat){t.h[sp]=h;t.r[sp]=res}else{t.h=h;t.r=res}
 dirty.add("holes/"+key);dirty.add("cup/"+key);render();flush()}
if(scorer)$('app').addEventListener('click',e=>{if(!mOK()||!loaded)return;const sat=MK[0]==="s",t=sat?S.sat[+MK.slice(1)]:S.sun[+MK.slice(1)],len=sat?9:18,hs=sat?t.h[sp]:t.h,c=calc(hs,len);
 const b=e.target.closest('[data-hole],[data-part],[data-chip],[data-undo],[data-cancel]');if(!b)return;const d=b.dataset;
 if(d.part!==undefined){sp=+d.part;edit=null;render()}
 else if(d.cancel){edit=null;render()}
 else if(d.chip!==undefined){edit=+d.chip;render()}
 else if(d.undo){if(c.thru)commit(hs.slice(0,c.thru-1))}
 else if(d.hole){if(edit!==null)commit(hs.slice(0,edit)+d.hole+hs.slice(edit+1));else if(!c.done)commit(hs.slice(0,c.thru)+d.hole)}});
if(/[?&]admin/.test(location.search))$('app').addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;const k=b.dataset.copy,u=location.origin+location.pathname+"?m="+k+"&k="+tok(k);
 const done=()=>{setMsg("Copied the scorer link for this match.");b.textContent="Copied"};
 try{navigator.clipboard.writeText(u).then(done,()=>setMsg(u))}catch(x){setMsg(u)}});
document.querySelector('nav').addEventListener('click',e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}});
admin=/[?&]admin/.test(location.search);
/* events live in the database as events/<year>/config (the lineup, saved by the setup page), cup (results) and holes (hole by hole) */
function applyCfg(y,cfg){const os=y.sat||[],ou=y.sun||[];
 y.year=cfg.year;y.title=cfg.title||"The Woody";y.teams=cfg.teams;y.set=!!cfg.set;y.sunSet=!!cfg.sunSet;y.tee=cfg.tee||{start:540,step:8,per:2};
 y.roster=cfg.roster||null;y.nP=(cfg.roster&&cfg.roster.A&&cfg.roster.A.length)||(cfg.sun||[]).length||16;
 y.sat=(cfg.sat||[]).map((m,i)=>({a:m.a,b:m.b,p:m.p,r:(os[i]&&os[i].r)||[null,null,null],h:(os[i]&&os[i].h)||["","",""]}));
 y.sun=(cfg.sun||[]).map((m,i)=>({a:m.a,b:m.b,oa:m.oa,ob:m.ob,p:m.p,r:(ou[i]&&ou[i].r)||null,h:(ou[i]&&ou[i].h)||""}));return y}
const evUrl=(yr,f)=>BASE+"/events/"+yr+"/"+f+".json";
async function boot(){
 try{const r=await fetch(BASE+'/events.json?shallow=true',{cache:'no-store'});if(!r.ok)return;const o=await r.json();
  const yrs=Object.keys(o||{}).map(Number).filter(Boolean).sort((a,b)=>a-b);
  for(const yr of yrs){try{
   const [c,cu,ho]=await Promise.all([fetch(evUrl(yr,'config'),{cache:'no-store'}),fetch(evUrl(yr,'cup'),{cache:'no-store'}),fetch(evUrl(yr,'holes'),{cache:'no-store'})]);
   const str=await c.json();if(typeof str!=="string")continue;const cfg=JSON.parse(str);
   const y=applyCfg({ev:true,live:false,cfgStr:str},cfg);fromMap(await cu.json(),y);fromHoles(await ho.json(),y);
   const i=YEARS.findIndex(x=>x.year===y.year);if(i>=0)YEARS.splice(i,1);YEARS.push(y);
   y.closed=cfg.status==="closed"}catch(e){}}
  YEARS.sort((a,b)=>b.year-a.year);
  const live=YEARS.find(y=>y.ev&&!y.closed);if(live){live.live=true;LIVE=live;ROOT=BASE+"/events/"+live.year}
  S=LIVE||YEARS[0]}catch(e){}}
async function load(){if(!LIVE)return true;let ok=false;why="";
 try{const [a,b,c]=await Promise.all([fetch(ROOT+'/cup.json',{cache:'no-store'}),fetch(ROOT+'/holes.json',{cache:'no-store'}),fetch(ROOT+'/config.json',{cache:'no-store'})]);
  if(a.ok&&b.ok){
   if(c.ok&&LIVE.ev){const str=await c.json();if(typeof str==="string"&&str!==LIVE.cfgStr){try{applyCfg(LIVE,JSON.parse(str));LIVE.cfgStr=str}catch(e){}}}
   fromMap(await a.json());fromHoles(await b.json());ok=true}else why="error "+(a.ok?b.status:a.status)}catch(e){why="blocked"}
 live=ok;if(!ok){if(admin||scorer)setMsg("Can't reach the scoreboard database ("+why+"). Scores will not save.",true);else $('hint').textContent="Reconnecting to the scoreboard..."}return ok}
(async()=>{
 if(admin||scorer)return;
 const base=DBU.replace(/\/cup\.json$/,''),u=base+'/views2.json';
 const show=n=>{$('views').textContent=Number(n).toLocaleString()};
 try{
  await fetch(u,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({".sv":{"increment":1}})});
  const r=await fetch(u,{cache:'no-store'});if(r.ok){const n=await r.json();if(typeof n==="number")show(n)}
 }catch(e){}
})();

/* Share: draws a results picture on a canvas, then hands it to the phone's share sheet (or saves it) */
let shFile=null,shUrl="",shText="";
async function shareImg(){
 try{await Promise.all(['800 100px "Barlow Condensed"','700 40px "Barlow Condensed"','600 40px Inter','500 30px Inter'].map(f=>document.fonts.load(f)))}catch(e){}
 const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
 const D=(w,n)=>`${w} ${n}px "Barlow Condensed","Arial Narrow",Arial,sans-serif`,B=(w,n)=>`${w} ${n}px Inter,system-ui,Arial,sans-serif`;
 const T=(txt,x,y,font,color,al,ls)=>{g.font=font;g.fillStyle=color;g.textAlign=al||"left";g.textBaseline="alphabetic";if("letterSpacing"in g)g.letterSpacing=ls||"0px";g.fillText(txt,x,y)};
 const t=tot(),p=winProb(t),A=teamA(),Bn=teamB(),fin=TOT()-t.n===0,RED="#e0233f",NAVY="#0a1a33",MU="#aab7cc";
 g.fillStyle="#060d1b";g.fillRect(0,0,W,H);g.fillStyle=NAVY;g.fillRect(0,0,W,H);
 T((S.title||"The Woody").toUpperCase(),W/2,185,D(800,170),"#fff","center","2px");
 T((S.year+" · "+(S.live?"LIVE SCORE":"FINAL RESULT")).toUpperCase(),W/2,252,B(600,36),MU,"center","5px");
 g.fillStyle=RED;g.fillRect(60,305,480,400);g.fillStyle="#fff";g.fillRect(540,305,480,400);
 T(String(t.a),96,560,D(800,330),"#fff","left");T(String(t.b),984,560,D(800,330),NAVY,"right");
 T(S.teams.A.name.toUpperCase(),96,665,D(700,56),"#fff","left","1px");T(S.teams.B.name.toUpperCase(),984,665,D(700,56),NAVY,"right","1px");
 let head;
 if(p.s)head=p.t===1?`Tied ${t.a}–${t.b}`:`Team ${p.a===1?A:Bn} ${fin?"wins":"clinches"} ${p.a===1?t.a+"–"+t.b:t.b+"–"+t.a}`;
 else head=t.n===0?"Matches start soon":`After ${t.n} of ${TOT()} matches`;
 T(head.toUpperCase(),W/2,795,D(800,92),"#fff","center","1px");
 if(!p.s&&t.n>0){const pc=x=>Math.round(x*100)+"%";T(`${A} ${pc(p.a)}  ·  Tie ${pc(p.t)}  ·  ${Bn} ${pc(p.b)}`.toUpperCase(),W/2,855,D(700,46),MU,"center","2px");
  const x0=60,w0=960;g.fillStyle=RED;g.fillRect(x0,885,w0*p.a,18);g.fillStyle="#7d8ba3";g.fillRect(x0+w0*p.a,885,w0*p.t,18);g.fillStyle="#fff";g.fillRect(x0+w0*(p.a+p.t),885,w0*p.b,18)}
 if(S.set){const tf=teamFmt(),FN=["Best Ball","Scramble","Alt Shot","Singles"];
  T("POINTS BY FORMAT",60,985,B(600,32),MU,"left","4px");g.fillStyle="#233049";g.fillRect(60,1003,960,2);
  FN.forEach((f,i)=>{const y=1075+i*70;T(f.toUpperCase(),60,y,D(700,54),"#fff","left","1px");
   g.fillStyle=RED;g.fillRect(640,y-36,34,34);T(String(tf[i][0]),700,y,D(800,62),"#fff","left");
   g.fillStyle="#fff";g.fillRect(830,y-36,34,34);T(String(tf[i][1]),890,y,D(800,62),"#fff","left")})}
 const host=location.protocol.startsWith("http")?location.host:"";if(host)T(host,W/2,1318,B(500,30),MU,"center");
 const url=location.protocol.startsWith("http")?location.origin+location.pathname:"";
 shText=`${S.title||"The Woody"} ${S.year}: ${A} ${t.a}, ${Bn} ${t.b}`+(fin?" (final)":"");
 return{cv,url}}
async function openShare(){
 const{cv,url}=await shareImg();shUrl=url;$('shi').src=cv.toDataURL('image/png');shFile=null;
 cv.toBlob(b=>{if(b)shFile=new File([b],`the-woody-${S.year}.png`,{type:"image/png"})},"image/png");
 $('sh').hidden=false}
$('shb').addEventListener('click',openShare);
$('shx').addEventListener('click',()=>{$('sh').hidden=true});
$('sh').addEventListener('click',e=>{if(e.target===$('sh'))$('sh').hidden=true});
$('shs').addEventListener('click',()=>{const title=(S.title||"The Woody")+" "+S.year;
 try{if(shFile&&navigator.canShare&&navigator.canShare({files:[shFile]}))navigator.share({files:[shFile],title,text:shText}).catch(()=>{});
  else if(navigator.share)navigator.share({title,text:shText,url:shUrl||undefined}).catch(()=>{});
  else $('shn').textContent="Press and hold the picture to save it, or tap Save image."}catch(e){$('shn').textContent="Press and hold the picture to save it."}});
$('shd').addEventListener('click',()=>{const a=document.createElement('a');a.href=$('shi').src;a.download=`the-woody-${S.year}.png`;document.body.appendChild(a);a.click();a.remove()});
if(scorer)$('shb').style.display='none';
document.addEventListener('keydown',e=>{if(e.key==="Escape")$('sh').hidden=true});

try{new IntersectionObserver(es=>{$('mini').hidden=scorer||es[0].isIntersecting},{threshold:0}).observe(document.querySelector('.hero'))}catch(e){}
if(scorer){document.querySelector('.cap').style.display='none';document.querySelector('.sb').style.display='none';$('wp').style.display='none';document.body.style.paddingBottom='70px'}
const ym=$('ym'),yb=$('yb');
const drawYears=()=>{ym.innerHTML='<div class="yh">Year</div>'+YEARS.map((y,i)=>`<button role="menuitem" data-y="${i}" class="${y===S?"on":""}">${y.year}${y.live?"<small>live</small>":""}</button>`).join("")};
const closeY=()=>{ym.hidden=true;yb.setAttribute('aria-expanded','false')};
drawYears();
yb.addEventListener('click',e=>{e.stopPropagation();const open=ym.hidden;ym.hidden=!open;yb.setAttribute('aria-expanded',String(open))});
ym.addEventListener('click',e=>{const b=e.target.closest('[data-y]');if(!b)return;S=YEARS[+b.dataset.y];tab="sat";drawYears();render()});
document.addEventListener('click',closeY);document.addEventListener('keydown',e=>{if(e.key==="Escape")closeY()});
if(scorer)$('yrw').style.display='none';
render();
if(admin||scorer){$('bar').hidden=false;setMsg(admin?"Scorekeeper mode: tap Win or Halve. Scores save automatically.":"Tap who won each hole. Scores save automatically.")}
(async()=>{await boot();drawYears();let ok=await load();loaded=true;render();
 if(scorer){while(!ok){await new Promise(r=>setTimeout(r,5000));ok=await load();render()}setMsg("Tap who won each hole. Scores save automatically.")}
 else if(admin&&ok)setMsg("Scorekeeper mode: tap Win or Halve. Scores save automatically.")})();
if(!admin&&!scorer)setInterval(()=>{if(LIVE)load().then(render)},15000);
