 const cl=k=>adm?`<div style="text-align:center;padding:6px;border-top:1px solid var(--ln)"><button class="lk" data-copy="${k}">Copy scorer link</button></div>`:"";
 const day=(name,sub,sc)=>`<div class="day"><div><b>${name}</b><span class="sub">${sub}</span></div><div class="ds"><div>${sq("A")}${sc[0]}</div><div>${sq("B")}${sc[1]}</div></div></div>`;
 const row=(r,mid,set,hs)=>{const w=r&&r.w;const lv=!w&&!adm&&hs?calc(hs,set[0]==="s"?9:18):null,live=lv&&lv.thru>0&&!lv.done?lv:null;
  const side=k=>w===k?`<span class="ch ${k}">${adm?`<input data-k="m" data-s="${set}" value="${r.m||""}" placeholder="W" aria-label="Margin of victory">`:(r.m||"W")}</span>`:(adm&&!w?`<button class="pk ${k}" data-pick="${k}" data-s="${set}">Win</button>`:(live&&((live.lead>0&&k==="A")||(live.lead<0&&k==="B"))?`<span class="ch lv ${k}">${Math.abs(live.lead)} UP</span>`:""));
  const mid2=w==="H"?(adm?`<button class="ch H" data-pick="" data-s="${set}" aria-label="Clear halved">Halved ×</button>`:'<span class="ch H">Halved</span>'):(adm&&!w?`<button class="pk" data-pick="H" data-s="${set}">Halve</button>`:"");
  return `<div class="g rw"><div>${side("A")}</div><div class="c"><span class="fm">${mid}</span>${live?`<div class="lvt">${live.lead===0?"AS thru ":"Thru "}${live.thru}</div>`:""}${mid2?`<div style="margin-top:3px">${mid2}</div>`:""}${adm&&w&&w!=="H"?`<div><button class="lk" data-pick="" data-s="${set}">Clear</button></div>`:""}</div><div>${side("B")}</div></div>`};
 let h="";
 if(scorer)h=scorerHTML(nm);
 else if(tab==="sun"&&!S.sunSet)h=`<div class="empty">Sunday matchups<small>Posted here after Saturday.</small></div>`;
 else if(tab==="sat"&&!S.set)h=`<div class="empty">Saturday matchups<small>Coming soon.</small></div>`;
 else if(tab==="sat"){h=day("Saturday","Two-man teams · 3 parts per match · 1 point each",t.sat);
  S.sat.forEach((m,i)=>{h+=`<section class="card"><div class="g hd"><div>${nm("A",m.a)}</div><div class="c">vs</div><div>${nm("B",m.b)}</div></div>`;
   m.r.forEach((r,j)=>{h+=row(r,F[j],"s"+i+"-"+j,m.h&&m.h[j])});h+=cl("s"+i)+"</section>"})}
 else if(tab==="sun"){h=day("Sunday","Singles · 16 matches · 1 point each",t.sun);
  const tee=i=>{const t=540+8*Math.floor(i/2);return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")+" AM"};S.sun.forEach((m,i)=>{h+=`<section class="card"><div class="g hd"><div>${nm("A",m.a)}${odd(m.oa)}</div><div class="c">vs<div class="tt">${tee(i)}</div></div><div>${nm("B",m.b)}${odd(m.ob)}</div></div>${row(m.r,"Singles","u"+i,m.h)}${cl("u"+i)}</section>`});h+=`<p class="note">Odds are pregame moneylines from each player's average score. A halved match is a push.</p>`}
 else{h=`<div class="day"><div><b>Players</b><span class="sub">${S.set?"Record: wins-losses-halves":"Rosters"}</span></div></div>`;
  if(S.set){const tf=teamFmt(),FN=["Best Ball","Scramble","Alt Shot","Singles"],fx=x=>String(x);
   h+=`<section class="card"><div class="th N">Points by format</div><div class="pr h pf"><span></span><span>${sq("A")}${S.teams.A.name.replace(/^Team /,"")}</span><span>${sq("B")}${S.teams.B.name.replace(/^Team /,"")}</span></div>`+FN.map((f,i)=>`<div class="pr pf"><span>${f}</span><span><b>${fx(tf[i][0])}</b></span><span><b>${fx(tf[i][1])}</b></span></div>`).join("")+`</section>`}
  ["A","B"].forEach(k=>{const names=S.sun.map(m=>m[k.toLowerCase()]);
   h+=`<section class="card"><div class="th ${k}">${S.teams[k].name}</div>`;
   if(!S.set)h+=names.map(n=>`<div class="pr"><span>${n}</span></div>`).join("");
   else{h+=`<div class="pr h"><span>Player</span><span>W-L-H</span><span>Pts</span></div>`;
    names.map((n,i)=>({n,i,r:rec(k,n)})).sort((x,y)=>y.r[3]-x.r[3]||x.i-y.i).forEach(o=>{h+=`<div class="pr"><span>${o.n}<i class="fp">BB ${o.r[4][0]} · SC ${o.r[4][1]} · AS ${o.r[4][2]} · Singles ${o.r[4][3]}</i></span><span>${o.r[0]}-${o.r[1]}-${o.r[2]}</span><span><b>${o.r[3]}</b></span></div>`})}
   h+="</section>"});
  if(S.set)h+=`<p class="note">BB best ball, SC scramble, AS alt shot. Saturday parts count for both partners.</p>`}
 $('app').innerHTML=h;
 $('hint').textContent=scorer?"":adm?"Scorekeeper mode: tap Win or Halve, then type the margin in the tag.":S.live?"Scores refresh automatically. v16":"Final results. v16";
}
const P=new URLSearchParams(location.search),DB=P.get('db')||'woody-dc613-default-rtdb.firebaseio.com';
const DBU=(window.WOODY_DB||('https://'+DB.replace(/^https?:\/\//,'').replace(/\/+$/,'')))+'/cup.json';
const ROOT=DBU.replace(/\/cup\.json$/,'');
const dirty=new Set();let busy=false,live=true,why="",loaded=false;
const setMsg=(m,bad)=>{$('msg').textContent=m;$('bar').style.background=bad?'#8a1020':''};
/* every match saves only its own entries, so several scorekeepers can work at the same time */
const valueFor=p=>{const [g,k]=p.split("/"),sat=k[0]==="s",[i,j]=k.slice(1).split("-").map(Number);
 if(g==="cup"){const r=sat?S.sat[i].r[j]:S.sun[i].r;return r&&r.w?r.w+"|"+(r.m||""):null}
 const h=sat?S.sat[i].h[j]:S.sun[i].h;return h||null};
async function flush(){if(busy||!dirty.size)return;busy=true;setMsg("Saving...");let bad=false;const errs=[];
 for(const p of [...dirty]){const v=valueFor(p);
  try{const r=await fetch(ROOT+"/"+p+".json",v===null?{method:"DELETE"}:{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(v)});
   if(r.ok){if(valueFor(p)===v)dirty.delete(p)}else{bad=true;errs.push(r.status)}}catch(e){bad=true;errs.push("blocked")}}
 busy=false;
 if(!bad){setMsg("Saved. Everyone's screen updates within seconds.");if(dirty.size)flush()}
 else{setMsg("Not saved. Error: "+[...new Set(errs)].join(", ")+". Will retry in 10 seconds.",true);setTimeout(flush,10000)}}
function setRes(s,fn){const g=s[0],[i,j]=s.slice(1).split("-").map(Number);
 let r=(g==="s"?S.sat[i].r[j]:S.sun[i].r);r=fn(r);
 if(g==="s")S.sat[i].r[j]=r;else S.sun[i].r=r;render();dirty.add("cup/"+s);flush()}
$('app').addEventListener('change',e=>{const d=e.target.dataset;if(d.s&&d.k==="m")setRes(d.s,r=>r?Object.assign({},r,{m:e.target.value.trim()}):r)});
$('app').addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(!b)return;const v=b.dataset.pick;setRes(b.dataset.s,()=>v?{w:v,m:""}:null)});
const fromMap=(m,T=LIVE)=>{m=m||{};const g=k=>{const v=m[k];if(typeof v!=="string")return null;const [w,...mm]=v.split("|");return w?{w,m:mm.join("|")}:null};
 T.sat.forEach((x,i)=>{x.r=[0,1,2].map(j=>g("s"+i+"-"+j))});T.sun.forEach((x,i)=>{x.r=g("u"+i)})};
const fromHoles=(m,T=LIVE)=>{m=m||{};const g=k=>typeof m[k]==="string"?m[k]:"";T.sat.forEach((x,i)=>{x.h=[0,1,2].map(j=>g("s"+i+"-"+j))});T.sun.forEach((x,i)=>{x.h=g("u"+i)})};
if(LIVE)fromHoles({});
/* hole-by-hole: h is a string like "AHB" (A = Anderson won the hole, B = French won it, H = halved) */
function calc(h,len){let a=0,b=0,thru=0;h=h||"";
 for(let i=0;i<len;i++){const c=h[i];if(c!=="A"&&c!=="B"&&c!=="H")break;if(c==="A")a++;if(c==="B")b++;thru=i+1;const rem=len-thru;
  if(Math.abs(a-b)>rem)return{a,b,thru,lead:a-b,done:true,w:a>b?"A":"B",m:rem?Math.abs(a-b)+"&"+rem:Math.abs(a-b)+" UP"}}
 if(thru===len)return{a,b,thru,lead:a-b,done:true,w:"H",m:""};
 return{a,b,thru,lead:a-b,done:false}}
const tok=k=>{let h=2166136261;const s="woody26|"+k;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36).padStart(7,"0").slice(-4)};
const MK=P.get('m'),KT=P.get('k');
const mOK=!!MK&&/^(s[0-7]|u([0-9]|1[0-5]))$/.test(MK)&&KT===tok(MK);
const scorer=!!MK&&!/[?&]admin/.test(location.search);
let sp=0,edit=null;
const teamA=()=>S.teams.A.name.replace(/^Team /,""),teamB=()=>S.teams.B.name.replace(/^Team /,"");
function stat(c){if(!c.thru)return"Not started";
 if(c.done)return c.w==="H"?"Halved":(c.w==="A"?teamA():teamB())+" won "+c.m;
 return c.lead===0?"All square thru "+c.thru:(c.lead>0?teamA():teamB())+" "+Math.abs(c.lead)+" UP thru "+c.thru}
function scorerHTML(nm){
 if(!LIVE)return`<div class="empty">No event right now<small>Nothing is being scored at the moment.</small></div>`;
 if(!mOK)return`<div class="empty">Link not valid<small>Ask whoever runs the scoreboard to send this match's link again.</small></div>`;
 if(!loaded)return`<div class="empty">Loading...<small>Getting the current scores.</small></div>`;
 const sat=MK[0]==="s",i=+MK.slice(1),t=sat?S.sat[i]:S.sun[i],len=sat?9:18,hs=sat?t.h[sp]:t.h,c=calc(hs,len);
 let h=`<section class="card"><div class="g hd"><div>${nm("A",t.a)}</div><div class="c">vs</div><div>${nm("B",t.b)}</div></div>`;
 if(sat)h+=`<div class="sp">${F.map((f,j)=>`<button data-part="${j}" class="${j===sp?"on":""}">${f}<small>${stat(calc(t.h[j],9)).replace(/ thru \d+/,"")}</small></button>`).join("")}</div>`;
 h+=`<div class="st">${stat(c)}<small>${sat?F[sp]+" · 9 holes":"Singles · 18 holes"}</small></div>`;
 const hole=edit!==null?edit+1:c.thru+1;
 if(c.done&&edit===null)h+=`<div class="hp">Match over</div>`;
 else h+=`<div class="hp">${edit!==null?`Fixing hole ${hole} <button class="lk" data-cancel="1">Cancel</button>`:`Hole ${hole}: who won it?`}</div><div class="bt"><button class="A" data-hole="A">${teamA()}</button><button class="H" data-hole="H">Halved</button><button class="B" data-hole="B">${teamB()}</button></div>`;
 h+=`<div class="hc">${Array.from({length:len},(_,k)=>{const ch=k<c.thru?hs[k]:"";return`<button class="${ch}${edit===k?" cur":""}" ${ch?`data-chip="${k}"`:"disabled"} aria-label="Hole ${k+1}">${k+1}</button>`}).join("")}</div>`;
 h+=`<div style="text-align:center;padding:2px 0 14px">${c.thru?`<button class="lk" data-undo="1">Undo last hole</button>`:""}</div></section><p class="note" style="text-align:center">Tap a colored number to fix an earlier hole. <a href="${location.pathname}" style="color:var(--mu)">See the full scoreboard</a></p>`;
 return h}
function commit(h){const sat=MK[0]==="s",i=+MK.slice(1),t=sat?S.sat[i]:S.sun[i],len=sat?9:18;
 h=h.slice(0,calc(h,len).thru);edit=null;const c=calc(h,len),res=c.done?{w:c.w,m:c.m}:null,key=sat?MK+"-"+sp:MK;
 if(sat){t.h[sp]=h;t.r[sp]=res}else{t.h=h;t.r=res}
 dirty.add("holes/"+key);dirty.add("cup/"+key);render();flush()}
if(scorer)$('app').addEventListener('click',e=>{if(!mOK||!loaded)return;const sat=MK[0]==="s",t=sat?S.sat[+MK.slice(1)]:S.sun[+MK.slice(1)],len=sat?9:18,hs=sat?t.h[sp]:t.h,c=calc(hs,len);
 const b=e.target.closest('[data-hole],[data-part],[data-chip],[data-undo],[data-cancel]');if(!b)return;const d=b.dataset;
 if(d.part!==undefined){sp=+d.part;edit=null;render()}
 else if(d.cancel){edit=null;render()}
 else if(d.chip!==undefined){edit=+d.chip;render()}
 else if(d.undo){if(c.thru)commit(hs.slice(0,c.thru-1))}
 else if(d.hole){if(edit!==null)commit(hs.slice(0,edit)+d.hole+hs.slice(edit+1));else if(!c.done)commit(hs.slice(0,c.thru)+d.hole)}});
if(/[?&]admin/.test(location.search))$('app').addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;const k=b.dataset.copy,u=location.origin+location.pathname+"?m="+k+"&k="+tok(k);
 const done=()=>{setMsg("Copied the scorer link for this match.");b.textContent="Copied"};
 try{navigator.clipboard.writeText(u).then(done,()=>setMsg(u))}catch(x){setMsg(u)}});
document.querySelector('nav').addEventListener('click',e=>{if(e.target.dataset.t){tab=e.target.dataset.t;render()}});
admin=/[?&]admin/.test(location.search);
async function load(){if(!LIVE)return true;let ok=false;why="";
 try{const [a,b]=await Promise.all([fetch(ROOT+'/cup.json',{cache:'no-store'}),fetch(ROOT+'/holes.json',{cache:'no-store'})]);
  if(a.ok&&b.ok){fromMap(await a.json());fromHoles(await b.json());ok=true}else why="error "+(a.ok?b.status:a.status)}catch(e){why="blocked"}
 live=ok;if(!ok){if(admin||scorer)setMsg("Can't reach the scoreboard database ("+why+"). Scores will not save.",true);else $('hint').textContent="Reconnecting to the scoreboard..."}return ok}
(async()=>{
 if(admin||scorer)return;
 const base=DBU.replace(/\/cup\.json$/,''),u=base+'/views2.json';
 const show=n=>{$('views').textContent=Number(n).toLocaleString()};
 try{
  await fetch(u,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({".sv":{"increment":1}})});
  const r=await fetch(u,{cache:'no-store'});if(r.ok){const n=await r.json();if(typeof n==="number")show(n)}
 }catch(e){}
})();

if(scorer){document.querySelector('.cap').style.display='none';document.querySelector('.sb').style.display='none';$('wp').style.display='none';document.body.style.paddingBottom='70px'}
$('yr').innerHTML=YEARS.map((y,i)=>`<option value="${i}">${y.year}${y.live?" (live)":""}</option>`).join("");$('yr').value=String(YEARS.indexOf(S));
$('yr').addEventListener('change',e=>{S=YEARS[+e.target.value];tab="sat";render()});
if(scorer)$('yrw').style.display='none';
render();
if(admin||scorer){$('bar').hidden=false;setMsg(admin?"Scorekeeper mode: tap Win or Halve. Scores save automatically.":"Tap who won each hole. Scores save automatically.")}
(async()=>{let ok=await load();loaded=true;render();
 if(scorer){while(!ok){await new Promise(r=>setTimeout(r,5000));ok=await load();render()}setMsg("Tap who won each hole. Scores save automatically.")}
 else if(admin&&ok)setMsg("Scorekeeper mode: tap Win or Halve. Scores save automatically.")})();
if(LIVE&&!admin&&!scorer)setInterval(()=>load().then(render),15000);
</script></body></html>
